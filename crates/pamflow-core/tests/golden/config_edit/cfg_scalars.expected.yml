paths:
  project_root: "."
  audio_standardized: "E:\\GNI\\Standard \"set\""

filenames:
  # G0059_YYYYMMDD_HHMMSS.flac ; timestamps are local time
  pattern: "^(?<grid>G\\d{4})_(?<date>\\d{8})_(?<time>\\d{6})(_chunk\\d+)?\\.(flac|wav)$"
  timezone: "Asia/Kolkata"

birdnet:
  run_id: "run01"
  min_confidence: 0.3
  workers: 8  # parallel worker processes, each with its own model copy.
                            # null = half of the physical cores.
  chunk_size: null  # files per batch
  overlap_s: 1.5

deployments:
  columns: [deployment_id, recorder, grid]
processing:
  species_whitelist:
    - Psittacula columboides
    - Ocyceros griseus
  min_confidence: 0.5
report:
  title: "Nilgiris PAM"  # a hash inside quotes is not a comment
