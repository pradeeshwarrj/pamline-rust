[workspace]
resolver = "2"
members = ["crates/pamflow-core", "crates/pamflow-engine"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
yaml-rust2 = "0.11"
thiserror = "2"
