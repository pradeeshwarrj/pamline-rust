[package]
name = "pamflow-ui"
version = "0.1.0"
edition = "2021"
publish = false

# own workspace: built by trunk (WebAssembly), not with the engine crates
[workspace]

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
futures = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Storage", "Document", "Element", "MediaQueryList"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
